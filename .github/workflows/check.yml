name: Exact finite checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python code/verify_release.py --out /tmp/k2p-normal
      - run: python -O code/verify_release.py --out /tmp/k2p-optimized
